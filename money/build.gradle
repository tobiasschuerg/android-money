plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'maven-publish'
}

group = 'com.github.tobiasschuerg'

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'android-money'
        }
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

repositories {
    mavenCentral()
}
